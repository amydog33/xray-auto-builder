name: Auto Build Latest Xray (Insecure + HUD Memory Hook)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Helper Repo
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout Latest Xray-core
        uses: actions/checkout@v4
        with:
          repository: 'XTLS/Xray-core'
          fetch-depth: 1
          path: xray

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Run Patch Script
        run: |
          cd xray
          python3 ../helper/patch.py

      - name: Build Windows Binary
        run: |
          cd xray
          export CGO_ENABLED=0
          export GOOS=windows
          export GOARCH=amd64
          go build -o xray.exe -trimpath -ldflags="-s -w -buildid=" ./main
          zip -9 xray-windows-64.zip xray.exe
          mv xray-windows-64.zip ../

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Xray-core (Full-Insecure + HUD-Memory)
          body: |
            自动构建完成时间: ${{ github.event.head_commit.timestamp }}
            1. 彻底跳过底层 TLS 证书校验（自签与老旧 CN 证书直接放行）。
            2. 内置 127.0.0.1:10091 UDP 内存域名流，零磁盘读写驱动 HUD。
          files: xray-windows-64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
