name: Auto Build Latest Xray with allowInsecure

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Xray-core
        uses: actions/checkout@v4
        with:
          repository: 'XTLS/Xray-core'
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Patch allowInsecure
        run: |
          python3 -c '
          import os

          patched = False
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".go"):
                      fpath = os.path.join(root, file)
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          lines = f.readlines()
                      new_lines = []
                      modified = False
                      for line in lines:
                          # 匹配并替换拦截 allowInsecure 报错的语句
                          if "allowInsecure" in line and ("has been removed" in line or "deprecated" in line):
                              indent = line[:len(line) - len(line.lstrip())]
                              new_lines.append(f"{indent}config.InsecureSkipVerify = true // patched\n")
                              modified = True
                              patched = True
                          else:
                              new_lines.append(line)
                      if modified:
                          with open(fpath, "w", encoding="utf-8") as f:
                              f.writelines(new_lines)
                          print(f"Successfully patched: {fpath}")

          if not patched:
              print("Warning: Deprecation string not matched, checking general config")
          '

      - name: Build Windows Binary
        run: |
          export CGO_ENABLED=0
          export GOOS=windows
          export GOARCH=amd64
          go build -o xray.exe -trimpath -ldflags="-s -w -buildid=" ./main
          zip -9 xray-windows-64.zip xray.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Xray-core (allowInsecure Enabled)
          body: |
            构建时间: ${{ github.event.head_commit.timestamp }}
            基于官方最新 Xray-core 构建，已恢复并放行 allowInsecure 自签证书。
          files: xray-windows-64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
